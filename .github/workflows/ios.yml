name: iOS

# The repository is public, so macOS minutes are free. The cache is here for
# iteration speed, not cost: a cold Open CASCADE cross-compile is about an hour
# per SDK slice and there are two of them.
on:
  push:
    # Branches only. Publishing a release pushes its tag, and without this that
    # tag push and the release event below are two runs of the same commit
    # racing in the same concurrency group.
    branches:
      - main
    paths:
      - 'ios/**'
      - 'native/**'
      - 'app/**'
      - 'tools/build_ios.py'
      - 'tools/verify_ios_sim.py'
      - '.github/workflows/ios.yml'
  # A release is cut from artifacts built on a Windows machine, which cannot
  # build iOS at all. Rebuilding here on publish is the only way a tagged
  # version has a corresponding iOS build that anyone can point at.
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  # Never cancel. The Open CASCADE cross-compile is about an hour per SDK slice
  # and actions/cache only writes at the end of a job, so a cancelled run
  # throws the whole thing away and saves nothing -- the next run starts cold
  # again. Cancelling on each push means the cache is never populated and no
  # run ever finishes. Queue instead.
  cancel-in-progress: false

env:
  OCCT_TAG: V7_9_3
  FIXTURE: tests/fixtures/survey

jobs:
  build:
    runs-on: macos-14
    # Only so a release-triggered run can put the .ipa on the release.
    permissions:
      contents: write
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Tools
        run: |
          brew install ninja
          xcodebuild -version
          cmake --version

      # Keyed on the build script itself: the flag list is what decides whether
      # a cached install is still the right one.
      - name: Restore Open CASCADE
        id: occt
        uses: actions/cache/restore@v4
        with:
          path: |
            .deps/occt-ios
            .deps/occt-iossim
          key: occt-${{ env.OCCT_TAG }}-ios-${{ hashFiles('native/build-occt-ios.sh') }}

      - name: Build Open CASCADE
        if: steps.occt.outputs.cache-hit != 'true'
        run: bash native/build-occt-ios.sh

      # Saved here rather than in a post step. actions/cache only writes at the
      # very end of a job and not at all when the job failed, so a break
      # anywhere below this line used to throw away two hours of cross-compile
      # and leave the next run starting cold.
      - name: Save Open CASCADE
        if: steps.occt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .deps/occt-ios
            .deps/occt-iossim
          key: occt-${{ env.OCCT_TAG }}-ios-${{ hashFiles('native/build-occt-ios.sh') }}

      - name: Build the interface
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Build the app
        run: python3 tools/build_ios.py both

      - name: Verify against the reference survey
        run: |
          set -euo pipefail
          app="out/ios-simulator/Release-iphonesimulator/Snapir.app"

          # Device type identifiers move between Xcode releases, so pick the
          # first one actually installed rather than naming a model.
          pick() {
            xcrun simctl list devicetypes \
              | grep -oE 'com\.apple\.CoreSimulator\.SimDeviceType\.[^)]+' \
              | grep -- "$1" \
              | head -1
          }

          for want in iPad-Pro iPhone-15; do
            type_id=$(pick "$want")
            if [ -z "$type_id" ]; then
              echo "No simulator device type matching $want"; exit 1
            fi
            echo "==> $want -> $type_id"

            udid=$(xcrun simctl create "ci-$want" "$type_id")
            # One device at a time, so 'booted' is never ambiguous.
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b

            python3 tools/verify_ios_sim.py "$app" "$FIXTURE" \
              --shot "shots/ios-$want.png"

            xcrun simctl shutdown "$udid"
            xcrun simctl delete "$udid"
          done

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: shots/*.png
          if-no-files-found: warn

      # An .ipa is a zip with the app inside Payload/, and nothing more. It is
      # left unsigned on purpose: there is no Apple Developer account, and
      # Sideloadly and AltStore strip whatever signature is there and re-sign
      # with the installing user's own Apple ID anyway, so signing here would
      # buy nothing.
      #
      # It has to be the DEVICE build. The simulator slice is x86_64/arm64-sim
      # and will install on no phone ever made, while looking exactly like a
      # working .ipa from the outside.
      - name: Wrap the device build as an unsigned .ipa
        run: |
          set -euo pipefail
          app="out/ios-device/Release-iphoneos/Snapir.app"
          test -d "$app" || { echo "No device build at $app"; exit 1; }

          # Refuse to ship a simulator slice dressed up as an .ipa. Anchored:
          # a simulator build says IOSSIMULATOR, which "platform IOS" on its
          # own would happily match.
          platform=$(vtool -show-build "$app/Snapir" 2>/dev/null | awk '$1=="platform"{print $2}')
          if [ "$platform" != "IOS" ]; then
            echo "$app is not an iOS device binary (platform=$platform):"
            vtool -show-build "$app/Snapir" || true
            exit 1
          fi

          version=$(node -p "require('./app/package.json').version")
          rm -rf payload && mkdir -p payload/Payload
          cp -R "$app" payload/Payload/
          (cd payload && zip -qry "../SnapirDesignX-$version.ipa" Payload)
          ls -lh "SnapirDesignX-$version.ipa"

      - name: Unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: SnapirDesignX-*.ipa
          if-no-files-found: error

      # When this run came from publishing a release, put the .ipa on the
      # release itself. As a bare workflow artifact it expires and nobody
      # looking at the release would ever find it.
      - name: Attach the .ipa to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" SnapirDesignX-*.ipa --clobber

      - name: App bundles
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-unsigned
          path: |
            out/ios-simulator/Release-iphonesimulator/Snapir.app
            out/ios-device/Release-iphoneos/Snapir.app
