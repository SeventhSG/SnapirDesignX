plugins {
    id 'com.android.application'
}

// CMake reads a Windows path's backslashes as string escapes and chokes on the
// \U in C:\Users, so every path handed to it goes in with forward slashes.
def occtRoot = rootProject.file('../.deps/occt-android').absolutePath.replace('\\', '/')
def nativeRoot = rootProject.file('../native').absolutePath.replace('\\', '/')

android {
    namespace 'com.snapirdesign.designx'
    compileSdk 34
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.snapirdesign.designx"
        minSdk 26
        targetSdk 34
        versionCode 31
        versionName "1.4.4"

        // The geometry kernel is built for 64-bit ARM only. That is every
        // Android phone worth surveying with, and building the other three
        // would quadruple an already long OCCT cross-compile.
        ndk { abiFilters 'arm64-v8a' }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared',
                          "-DOCCT_ANDROID_ROOT=${occtRoot}",
                          "-DSNAPIR_NATIVE_ROOT=${nativeRoot}"
                cppFlags '-std=c++17', '-fexceptions', '-frtti'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs { useLegacyPackaging false }
    }
}

// No dependencies. A WebView shell needs nothing AppCompat provides, and
// leaving it out drops the whole Kotlin stdlib chain that came with it.
dependencies {
}
